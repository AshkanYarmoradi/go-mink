name: Enforce PR Source Branch

on:
  pull_request:
    branches:
      - main

# This workflow only inspects pull_request event fields and echoes a message; it never
# uses the GITHUB_TOKEN. Drop all token permissions (principle of least privilege).
permissions: {}

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR comes from this repository's develop branch
        # Both conditions are required. github.head_ref alone is bypassable: a fork can
        # name any branch "develop", so the head must also live in this repository
        # (github.event.pull_request.head.repo.full_name == github.repository).
        if: >-
          github.head_ref != 'develop' ||
          github.event.pull_request.head.repo.full_name != github.repository
        # Bind the expressions to environment variables to prevent script injection
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          echo "❌ ERROR: Pull requests to 'main' must originate from the 'develop' branch of '${TARGET_REPO}' (not a fork)."
          # Safely reference the environment variables using standard shell syntax
          echo "Current source is '${SOURCE_REPO}' @ '${SOURCE_BRANCH}'."
          exit 1
